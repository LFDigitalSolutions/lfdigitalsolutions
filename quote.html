<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Request a Quote | L.F Digital Solutions</title>
    <meta name="description" content="Request a custom quote for your digital project from L.F Digital Solutions">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/LOGOTAB.png">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        .quote-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
            padding: 80px 20px 60px;
        }
        
        .quote-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .quote-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .quote-header h1 {
            font-size: 32px;
            color: #1E3A8A;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .quote-header p {
            color: #64748b;
            font-size: 16px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            font-size: 20px;
            color: #1E3A8A;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .checkbox-group {
            display: grid;
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .checkbox-item:hover {
            border-color: #6366f1;
            background: #f8fafc;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            cursor: pointer;
            font-size: 16px;
            color: #334155;
            flex: 1;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 767px) {
            .quote-container {
                padding: 30px 20px;
            }
            
            .quote-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="quote-page">
        <div class="quote-container">
            <a href="index.html" class="back-link">← Back to Home</a>
            
            <div class="quote-header">
                <h1>Request a Quote</h1>
                <p>Tell us about your project and we'll get back to you with a custom quote</p>
            </div>
            
            <form id="quote-form" action="https://api.web3forms.com/submit" method="POST">
                <!-- Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="d8cf9868-4e3e-4f15-a360-baa51ebd245a">
                <input type="hidden" name="subject" value="New Quote Request - L.F Digital Solutions">
                <input type="hidden" name="redirect" value="false">
                
                <!-- Services Section -->
                <div class="form-section">
                    <h2>Services Needed</h2>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="service1" name="Website Development" value="Yes">
                            <label for="service1">Website Development</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="service2" name="Custom Business System" value="Yes">
                            <label for="service2">Custom Business System</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="service3" name="Branding & Design" value="Yes">
                            <label for="service3">Branding & Design</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="service4" name="Custom Digital Solution" value="Yes">
                            <label for="service4">Custom Digital Solution</label>
                        </div>
                    </div>
                </div>
                
                <!-- Client Information -->
                <div class="form-section">
                    <h2>Your Information</h2>
                    <div class="form-group">
                        <label for="name" class="form-label">Name <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            class="form-input"
                            placeholder="Your Name"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email <span class="required">*</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input"
                            placeholder="your.email@example.com"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone <span class="required">*</span></label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-input"
                            placeholder="0966 123 4567"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="business" class="form-label">Business/Organization Name</label>
                        <input 
                            type="text" 
                            id="business" 
                            name="business" 
                            class="form-input"
                            placeholder="Your Business Name (Optional)"
                        >
                    </div>
                </div>
                
                <!-- Project Details -->
                <div class="form-section">
                    <h2>Project Details</h2>
                    
                    <div class="form-group">
                        <label for="budget" class="form-label">Budget Range</label>
                        <select id="budget" name="budget" class="form-input">
                            <option value="">Select budget range (Optional)</option>
                            <option value="Under ₱50,000">Under ₱50,000</option>
                            <option value="₱50,000 - ₱100,000">₱50,000 - ₱100,000</option>
                            <option value="₱100,000 - ₱200,000">₱100,000 - ₱200,000</option>
                            <option value="₱200,000 - ₱500,000">₱200,000 - ₱500,000</option>
                            <option value="Over ₱500,000">Over ₱500,000</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="timeline" class="form-label">Timeline Needed</label>
                        <select id="timeline" name="timeline" class="form-input">
                            <option value="">Select timeline (Optional)</option>
                            <option value="ASAP (Less than 1 month)">ASAP (Less than 1 month)</option>
                            <option value="1-2 months">1-2 months</option>
                            <option value="2-3 months">2-3 months</option>
                            <option value="3-6 months">3-6 months</option>
                            <option value="Flexible">Flexible</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="details" class="form-label">Project Description <span class="required">*</span></label>
                        <textarea 
                            id="details" 
                            name="details" 
                            class="form-input form-textarea" 
                            rows="5"
                            placeholder="Tell us about your project, goals, and any specific requirements..."
                            required
                        ></textarea>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-submit">
                    <span class="btn-text">Submit Quote Request</span>
                </button>
            </form>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
    
    <!-- JavaScript -->
    <script>
        // Simple form submission handler
        const form = document.getElementById('quote-form');
        const toastContainer = document.getElementById('toast-container');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = form.querySelector('.btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-text">Sending...</span>';
            
            try {
                const formData = new FormData(form);
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Success!', 'Your quote request has been sent. We\'ll get back to you soon!', 'success');
                    form.reset();
                } else {
                    showToast('Error', 'Something went wrong. Please try again.', 'error');
                }
            } catch (error) {
                showToast('Error', 'Something went wrong. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Submit Quote Request</span>';
            }
        });
        
        // Toast notification function
        function showToast(title, message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type} show`;
            toast.innerHTML = `
                <div class="toast-icon">${type === 'success' ? '✓' : '✕'}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <p class="toast-message">${message}</p>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
    </script>
</body>
</html>
